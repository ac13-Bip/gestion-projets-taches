<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Gestion des Tâches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Zwaq d l-khalfia (Background) */
        .hero-section {
            background: linear-gradient(135deg, #0d6efd 0%, #00d2ff 100%);
            height: 100vh;
            color: white;
            display: flex;
            align-items: center;
        }
        .hero-content {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="container text-center">
            <div class="row justify-content-center">
                <div class="col-md-8 hero-content">
                    
                    <i class="fas fa-network-wired fa-5x mb-4 text-warning"></i>
                    
                    <h1 class="display-4 fw-bold mb-3">Système de Gestion des Tâches</h1>
                    <p class="lead mb-5">
                        Simplifiez le travail en équipe, gérez vos projets efficacement et suivez l'avancement de vos tâches en temps réel.
                    </p>
                    
                    <a href="{% url 'login' %}" class="btn btn-warning btn-lg px-5 py-3 fw-bold shadow">
                        <i class="fas fa-sign-in-alt me-2"></i> Accéder à mon Espace
                    </a>
                    
                </div>
            </div>
        </div>
    </div>

</body>
</html>
