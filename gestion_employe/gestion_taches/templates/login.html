<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Gestion RH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .login-card { border-radius: 15px; border-top: 5px solid #0d6efd; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                
                <div class="text-center mb-4">
                    <i class="fas fa-users-cog fa-3x text-primary mb-3"></i>
                    <h3 class="fw-bold">Espace de Travail</h3>
                    <p class="text-muted">Connectez-vous pour accéder à vos tâches</p>
                </div>

                <div class="card shadow-lg border-0 login-card p-4">
                    <div class="card-body">
                        
                        <form method="POST">
                            {% csrf_token %}
                            
                            {% if form.errors %}
                            <div class="alert alert-danger py-2 text-center text-sm">
                                Email ou mot de passe incorrect.
                            </div>
                            {% endif %}

                            <div class="mb-3">
                                <label class="form-label fw-bold">Adresse Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
                                    <input type="email" name="username" class="form-control" placeholder="nom@role.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                <i class="fas fa-sign-in-alt me-2"></i> Se Connecter
                            </button>
                        </form>

                    </div>
                </div>
                
                <div class="text-center mt-3">
                    <a href="{% url 'accueil' %}" class="text-decoration-none text-muted"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
