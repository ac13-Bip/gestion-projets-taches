<div class="col-6 col-lg-3">
    <div class="card stat-card h-100"><div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <div class="text-muted small fw-bold">{{ libelle }}</div>
            <div class="h3 fw-bold mb-0 text-{{ couleur }}">{{ valeur }}{% if suffixe != None and suffixe != '' %}<span class="fs-6 text-muted"> / {{ suffixe }}</span>{% endif %}</div>
        </div>
        <div class="stat-icone bg-{{ couleur }} bg-opacity-10 text-{{ couleur }}"><i class="fas {{ icone }}"></i></div>
    </div></div>
</div>
