<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
    }
    .custom-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        overflow: hidden;
        background: rgba(255, 255, 255, 0.95);
    }
    .card-header {
        background: #198754 !important;
        border: none;
        padding: 1.5rem;
    }
    .form-control, .form-select {
        border-radius: 10px;
        padding: 0.75rem 1rem;
        border: 1px solid #e1e1e1;
        transition: all 0.3s ease;
    }
    .form-control:focus, .form-select:focus {
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
        border-color: #198754;
    }
    .btn-submit {
        background: #198754;
        border: none;
        border-radius: 12px;
        padding: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        transition: transform 0.2s;
    }
    .btn-submit:hover {
        background: #157347;
        transform: translateY(-2px);
    }
    .form-label {
        font-weight: 600;
        color: #495057;
        margin-left: 5px;
    }
</style>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card custom-card">
                <div class="card-header text-white text-center">
                    <h3 class="mb-0 fw-bold"><i class="fas fa-user-plus me-2"></i>Nouveau Employé</h3>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        
                        {% for field in form %}
                        <div class="mb-4">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        
                        <button type="submit" class="btn btn-success btn-submit w-100 shadow-sm mt-2">
                            Créer le Compte
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="{% url 'dashboard_admin' %}" class="text-muted text-decoration-none small">
                            <i class="fas fa-arrow-left me-1"></i> Retour au dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
