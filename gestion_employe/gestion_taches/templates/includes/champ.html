<div class="mb-3">
    <label class="form-label fw-semibold" for="{{ champ.id_for_label }}">{{ champ.label }}{% if champ.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ champ }}
    {% if champ.help_text %}<div class="form-text">{{ champ.help_text|safe }}</div>{% endif %}
    {{ champ.errors }}
</div>
