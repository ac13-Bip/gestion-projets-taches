name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestion_employe
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gestion_employe/requirements.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifications Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test -v 2
