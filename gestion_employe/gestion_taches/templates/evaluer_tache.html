<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Évaluer la tâche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-warning text-dark text-center py-3 border-0">
                        <h4 class="mb-0 fw-bold"><i class="fas fa-star me-2"></i> Évaluer la tâche</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="mb-4 text-center">
                            <p class="text-muted mb-1">Vous évaluez la tâche :</p>
                            <h5 class="fw-bold text-primary">{{ tache.titre }}</h5>
                            <span class="badge bg-secondary">Réalisée par : {{ tache.assigne_a.first_name }} {{ tache.assigne_a.last_name }}</span>
                        </div>

                        <hr class="mb-4">

                        <!-- L-Formulaire dyal l-Evaluation -->
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Note (sur 5) :</label>
                                {{ form.note }}
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Feedback / Remarques :</label>
                                {{ form.feedback_manager }}
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-warning fw-bold text-dark fs-5">
                                    <i class="fas fa-check-circle me-1"></i> Valider l'évaluation
                                </button>
                                <a href="{% url 'details_tache' tache.id %}" class="btn btn-outline-secondary">
                                    Annuler et retourner
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
